<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/brand/logo.png" />
    <title>芽伴 · Sproutkin — 桌面伙伴</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #pet {
        width: 240px;
        height: 310px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .needs {
        position: absolute;
        top: 2px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 14px;
        z-index: 3;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }

      /* 未领养态：盆里还没有植物，不显示浇水/晒太阳入口 */
      body.unadopted .needs {
        display: none;
      }

      #pet:hover .needs {
        opacity: 1;
        pointer-events: auto;
      }

      .need {
        display: block;
        width: 40px;
        height: 40px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        padding: 0;
        opacity: 0.45;
        filter: grayscale(0.35);
        transition:
          opacity 0.2s ease,
          filter 0.2s ease;
      }

      .need.show {
        opacity: 1;
        filter: none;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .bubble {
        position: absolute;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 200px;
        padding: 5px 12px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #e3e3d5;
        border-radius: 12px;
        font-size: 12px;
        color: #4a5a3f;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.25s ease;
        pointer-events: none;
        z-index: 4;
      }

      .bubble.show {
        opacity: 1;
      }

      .plant {
        position: relative;
        width: 210px;
        height: 210px;
        margin-top: 34px;
        transform: scale(var(--stage-scale, 1));
        filter: hue-rotate(var(--species-hue, 0deg));
        transition: transform 0.4s ease;
      }

      .plant.sunning {
        filter: hue-rotate(var(--species-hue, 0deg)) brightness(1.15)
          drop-shadow(0 0 10px rgba(255, 214, 80, 0.85));
      }

      .plant.bounce #pet-img {
        animation:
          bounce 0.5s ease,
          sway 4s ease-in-out infinite;
      }

      #pet-img {
        display: block;
        width: 100%;
        height: 100%;
        cursor: pointer;
        animation: sway 4s ease-in-out infinite;
        transform-origin: 50% 92%;
      }

      /* 拖拽热区：盆底横条（原 40% 宽）扩到全窗口宽，并向下延伸 60px 吃进 tip 行两侧空白；
         top 边沿线保持不变（原 30% 高度处），面部/叶子留给戳与抚摸手势 */
      .drag-zone {
        position: absolute;
        left: -15px;
        right: -15px;
        bottom: -60px;
        height: calc(30% + 60px);
        cursor: grab;
      }

      .heart {
        position: absolute;
        font-size: 14px;
        pointer-events: none;
        animation: float-up 1.1s ease-out forwards;
        z-index: 2;
      }

      .tip {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        background: rgba(255, 255, 255, 0.78);
        padding: 2px 10px;
        border-radius: 10px;
      }

      @keyframes sway {
        0%,
        100% {
          transform: rotate(-2deg);
        }

        50% {
          transform: rotate(2deg);
        }
      }

      @keyframes bounce {
        30% {
          transform: translateY(-10px);
        }

        60% {
          transform: translateY(0);
        }

        80% {
          transform: translateY(-4px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.12);
        }
      }

      @keyframes float-up {
        to {
          transform: translateY(-46px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="pet">
      <div class="needs">
        <button class="need" id="need-water" title="浇水">💧</button>
        <button class="need" id="need-sun" title="晒太阳">☀️</button>
      </div>
      <div class="bubble" id="bubble"></div>
      <div class="plant" id="plant">
        <div id="hearts"></div>
        <img id="pet-img" class="pettable" alt="芽伴植物伙伴" draggable="false" />
        <div class="drag-zone" data-tauri-drag-region></div>
      </div>
      <p class="tip" id="tip">摸摸我 · 悬浮浇水 · 拖花盆搬家</p>
    </div>
    <script type="module" src="/src/pet.ts"></script>
  </body>
</html>
